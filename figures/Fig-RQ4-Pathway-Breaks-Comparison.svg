<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1008 692" font-family="Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="1008" height="692" fill="#f8f7f4"/>
<text x="504.0" y="30" text-anchor="middle" font-size="21" font-weight="700" fill="#1e1e1e">Where coordination pathways reach, stall, or break</text>
<text x="504.0" y="52" text-anchor="middle" font-size="12.5" fill="#1e1e1e" opacity="0.75">A shared analytical spine (Codebook C → M → I → L → GL); each Episode plotted against its own empirically supported reach</text>
<text x="274.0" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">Capabilities</text>
<text x="274.0" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">mobilised</text>
<line x1="274.0" y1="110" x2="274.0" y2="144" stroke="#4859FD" stroke-opacity="0.18" stroke-dasharray="2,3"/>
<text x="402.0" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">Relational</text>
<text x="402.0" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">coordination</text>
<line x1="402.0" y1="110" x2="402.0" y2="144" stroke="#4859FD" stroke-opacity="0.18" stroke-dasharray="2,3"/>
<text x="530.0" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">Institutional</text>
<text x="530.0" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">instrument</text>
<line x1="530.0" y1="110" x2="530.0" y2="144" stroke="#4859FD" stroke-opacity="0.18" stroke-dasharray="2,3"/>
<text x="658.0" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">Governance</text>
<text x="658.0" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">location (L)</text>
<line x1="658.0" y1="110" x2="658.0" y2="144" stroke="#4859FD" stroke-opacity="0.18" stroke-dasharray="2,3"/>
<text x="786.0" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">Institutional /</text>
<text x="786.0" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">information</text>
<text x="786.0" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">leverage (GL1–3)</text>
<line x1="786.0" y1="123" x2="786.0" y2="144" stroke="#4859FD" stroke-opacity="0.18" stroke-dasharray="2,3"/>
<text x="914.0" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">Regulatory /</text>
<text x="914.0" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">behavioural</text>
<text x="914.0" y="108" text-anchor="middle" font-size="11" font-weight="700" fill="#4859FD">leverage (GL4–5)</text>
<line x1="914.0" y1="123" x2="914.0" y2="144" stroke="#4859FD" stroke-opacity="0.18" stroke-dasharray="2,3"/>
<text x="190" y="181" text-anchor="end" font-size="14" font-weight="700" fill="#1e1e1e">Bletchley Sequence</text>
