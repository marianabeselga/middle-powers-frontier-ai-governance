<circle cx="786.0" cy="412" r="15" fill="#5161fd" stroke="none" stroke-opacity="0"/>
<line x1="802.0" y1="412" x2="866" y2="412" stroke="#1e1e1e" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="914.0" cy="412" r="15" fill="#5161fd" stroke="none" stroke-opacity="0"/>
<text x="202" y="446" font-size="10.8" font-style="italic" fill="#1e1e1e" opacity="0.75">The only Episode with no break at any stage — the OECD Reporting Framework gives GL5 a developer-facing location to be observed</text>
<text x="202" y="460" font-size="10.8" font-style="italic" fill="#1e1e1e" opacity="0.75">through.</text>
<rect x="4" y="494" width="994" height="110" fill="#f0efed"/>
<text x="190" y="535" text-anchor="end" font-size="14" font-weight="700" fill="#1e1e1e">GPAI</text>
