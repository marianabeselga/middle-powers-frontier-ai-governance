<text x="202" y="328" font-size="10.8" font-style="italic" fill="#1e1e1e" opacity="0.75">No break at the collective level through GL1–GL3. GL4–GL5 not reached: the configuration's own instruments (testing/evaluation)</text>
<text x="202" y="342" font-size="10.8" font-style="italic" fill="#1e1e1e" opacity="0.75">create no developer-facing governance location.</text>
<text x="190" y="417" text-anchor="end" font-size="14" font-weight="700" fill="#1e1e1e">Hiroshima AI Process</text>
<circle cx="274.0" cy="412" r="15" fill="#5161fd" stroke="none" stroke-opacity="0"/>
<line x1="290.0" y1="412" x2="354" y2="412" stroke="#1e1e1e" stroke-opacity="0.35" stroke-width="2"/>
