<text x="202" y="210" font-size="10.8" font-style="italic" fill="#1e1e1e" opacity="0.75">Collective pathway complete (GL5 moderate confidence). Most individual country pathways stop earlier — 5 of 6 countries show</text>
<text x="202" y="224" font-size="10.8" font-style="italic" fill="#1e1e1e" opacity="0.75">country-level GL6 (attribution-scale gap, not a process-level break).</text>
<rect x="4" y="258" width="994" height="110" fill="#f0efed"/>
<text x="190" y="299" text-anchor="end" font-size="14" font-weight="700" fill="#1e1e1e">AISI Network</text>
