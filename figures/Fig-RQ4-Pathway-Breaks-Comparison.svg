<line x1="802.0" y1="530" x2="866" y2="530" stroke="#1e1e1e" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="3,4"/>
<line x1="829.0" y1="522" x2="839.0" y2="538" stroke="#1e1e1e" stroke-width="2"/>
<line x1="829.0" y1="538" x2="839.0" y2="522" stroke="#1e1e1e" stroke-width="2"/>
<circle cx="914.0" cy="530" r="12" fill="#edeef5" stroke="#1e1e1e" stroke-opacity="0.3"/>
<text x="202" y="564" font-size="10.8" font-style="italic" fill="#1e1e1e" opacity="0.75">Break located precisely between institutionalisation and regulatory/behavioural effect. GL2 plausible, not fully established. The</text>
<text x="202" y="578" font-size="10.8" font-style="italic" fill="#1e1e1e" opacity="0.75">source material itself repeatedly declines to attribute national regulation to GPAI.</text>
<circle cx="20" cy="652" r="10" fill="#5161fd"/>
<text x="38" y="657" font-size="11.5" fill="#1e1e1e">Stage reached (established)</text>
<circle cx="240" cy="652" r="10" fill="#aeb5f8" stroke-dasharray="2,2"/>
