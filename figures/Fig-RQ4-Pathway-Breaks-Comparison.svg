<line x1="418.0" y1="412" x2="482" y2="412" stroke="#1e1e1e" stroke-opacity="0.35" stroke-width="2"/>
<circle cx="530.0" cy="412" r="15" fill="#5161fd" stroke="none" stroke-opacity="0"/>
